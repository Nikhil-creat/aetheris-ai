apiVersion: apps/v1
kind: Deployment
metadata: { name: aetheris-api }
spec:
  replicas: 2
  selector: { matchLabels: { app: aetheris-api } }
  template:
    metadata: { labels: { app: aetheris-api } }
    spec:
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: api
          image: ghcr.io/nikhil-creat/aetheris-api:latest
          ports: [{ containerPort: 8000 }]
          envFrom: [{ secretRef: { name: aetheris-secrets } }]
          readinessProbe: { httpGet: { path: /api/health, port: 8000 } }
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: "1", memory: 1Gi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata: { name: aetheris-api }
spec: { selector: { app: aetheris-api }, ports: [{ port: 80, targetPort: 8000 }] }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: aetheris-api }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: aetheris-api }
  minReplicas: 2
  maxReplicas: 10
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } } }]
